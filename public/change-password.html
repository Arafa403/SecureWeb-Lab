
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Admin Password | SecureWeb Lab</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #0b1120;
      color: #e5e7eb;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      border: 1px solid #263449;
      border-radius: 16px;
      background: #111b2e;
    }
    h1 { font-size: 24px; margin-top: 0; }
    p { color: #9caec5; line-height: 1.5; }
    label { display: block; margin: 18px 0 8px; }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #34445c;
      border-radius: 8px;
      background: #0b1120;
      color: white;
    }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #38bdf8;
      color: #07111f;
      font-weight: bold;
      cursor: pointer;
    }
    #message { margin-top: 16px; overflow-wrap: anywhere; }
    a { color: #38bdf8; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Change Admin Password</h1>
    <p>Enter your current password and choose a new password.</p>

    <form id="passwordForm">
      <label for="currentPassword">Current password</label>
      <input id="currentPassword" type="password"
        autocomplete="current-password" required>

      <label for="newPassword">New password</label>
      <input id="newPassword" type="password"
        autocomplete="new-password" minlength="8" required>

      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" type="password"
        autocomplete="new-password" minlength="8" required>

      <button type="submit">Change Password</button>
    </form>

    <p id="message" role="status"></p>
    <p><a href="/admin.html">Back to Admin Dashboard</a></p>
  </main>

  <script>
    const form = document.getElementById("passwordForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "";

      const currentPassword =
        document.getElementById("currentPassword").value;
      const newPassword =
        document.getElementById("newPassword").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (newPassword !== confirmPassword) {
        message.textContent = "New passwords do not match.";
        return;
      }

      if (newPassword.length < 8 ||
          new TextEncoder().encode(newPassword).length > 72) {
        message.textContent =
          "Password must be at least 8 characters and no more than 72 UTF-8 bytes.";
        return;
      }

      try {
        const response = await fetch("/api/admin/change-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ currentPassword, newPassword })
        });

        const result = await response.json();

        if (!response.ok) {
          message.textContent = result.error || "Password change failed.";
          return;
        }

        form.reset();
        message.textContent =
          "Password changed successfully. Save your new password securely.";
      } catch {
        message.textContent = "Could not connect to the server.";
      }
    });
  </script>
</body>
</html>
